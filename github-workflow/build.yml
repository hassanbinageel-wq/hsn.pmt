name: build-apk

# بناء ملف APK تلقائيًا على خوادم GitHub (لا حاجة لأندرويد ستوديو على جهازك)
# يعمل عند الرفع لفرع main أو يدويًا من تبويب Actions.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تهيئة Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: قبول تراخيص Android SDK (المثبّت مسبقًا على الخادم)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using SDK at: $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "licenses accepted"

      - name: تثبيت الحزم
        run: npm install

      - name: إضافة منصة أندرويد
        run: npx cap add android

      - name: مزامنة الملفات والإضافات
        run: npx cap sync android

      - name: توليد الأيقونة وشاشة البداية
        run: npx capacitor-assets generate --android --iconBackgroundColor '#05111a' --iconBackgroundColorDark '#05111a' --splashBackgroundColor '#05111a' --splashBackgroundColorDark '#05111a' || echo "skip assets"

      - name: إضافة صلاحيات جهات الاتصال إلى المانيفست
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          if ! grep -q "WRITE_CONTACTS" "$MF"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <uses-permission android:name="android.permission.WRITE_CONTACTS"/>\n    <application#' "$MF"
          fi
          echo "----- manifest permissions -----"
          if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MF"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application#' "$MF"
          fi
          if ! grep -q "requestLegacyExternalStorage" "$MF"; then
            sed -i 's#<application\([ >]\|$\)#<application android:requestLegacyExternalStorage="true"\1#' "$MF"
          fi
          grep -n "uses-permission\|requestLegacyExternalStorage" "$MF" || true

      - name: تثبيت مفتاح التوقيع الثابت (لتحديث التطبيق دون فقد البيانات)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: بناء APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: رفع ملف APK كناتج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hsn-pmt-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: نشر APK كإصدار (Release) — رابط تحميل مباشر
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: hsn.pmt APK — build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
